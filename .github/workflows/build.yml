name: Build WirelessBatteryHub EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate App Icon (src/app.ico)
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32, 32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $bg = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(30, 32, 40))
          $g.FillRectangle($bg, 2, 2, 28, 28)
          $border = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(80, 200, 255)), 2
          $g.DrawRectangle($border, 2, 2, 28, 28)
          $whitePen = New-Object System.Drawing.Pen ([System.Drawing.Color]::White), 2
          $g.DrawRectangle($whitePen, 7, 10, 15, 12)
          $whiteBrush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $g.FillRectangle($whiteBrush, 22, 13, 3, 6)
          $greenBrush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(70, 215, 115))
          $g.FillRectangle($greenBrush, 9, 12, 11, 8)
          $g.Dispose()

          $ms = New-Object System.IO.MemoryStream
          $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
          $png = $ms.ToArray()
          $bmp.Dispose()
          $ms.Dispose()

          $fs = [System.IO.File]::Create("src/app.ico")
          $bw = New-Object System.IO.BinaryWriter $fs
          $bw.Write([uint16]0)
          $bw.Write([uint16]1)
          $bw.Write([uint16]1)
          $bw.Write([byte]32)
          $bw.Write([byte]32)
          $bw.Write([byte]0)
          $bw.Write([byte]0)
          $bw.Write([uint16]1)
          $bw.Write([uint16]32)
          $bw.Write([uint32]$png.Length)
          $bw.Write([uint32]22)
          $bw.Write($png)
          $bw.Close()
          $fs.Close()

      - name: Publish Single-File EXE
        run: |
          $csproj = Get-ChildItem -Filter *.csproj -Recurse | Select-Object -First 1
          if (-not $csproj) { exit 1 }

          $ver = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { '1.0.0' }
          $infoVer = "$ver|$($env:GITHUB_REPOSITORY)"

          dotnet publish "$($csproj.FullName)" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:ApplicationIcon=app.ico `
            -p:Version=$ver `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:InformationalVersion="$infoVer" `
            -o publish

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WirelessBatteryHub-win-x64
          path: publish/*.exe

      - name: Create Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*.exe
